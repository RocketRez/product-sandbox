<title>Membership Photo Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: minimal back-office shell. Top bar with tabs; each tab is one working surface on a soft grey canvas with white panels. */
  :root{
    --bg:#F6F7F9; --panel:#FFFFFF; --sunken:#F2F4F7; --photo:#E9ECF1;
    --line:#E4E7EC; --line-strong:#D0D5DD;
    --text:#101828; --text-2:#475467; --text-3:#98A2B3;
    --accent:#0051F9; --accent-hover:#0042CC; --accent-soft:#EEF3FF; --on-accent:#FFFFFF;
    --ok:#067647; --ok-soft:#ECFDF3; --warn:#B54708; --warn-soft:#FFFAEB; --bad:#B42318; --bad-soft:#FEF3F2;
    --shadow:0 1px 2px rgba(16,24,40,.05);
    --pop:0 12px 32px rgba(16,24,40,.14);
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0C0E12; --panel:#14171D; --sunken:#1A1E26; --photo:#1F242D;
      --line:#262B35; --line-strong:#353C48;
      --text:#F2F4F7; --text-2:#B4BCC8; --text-3:#7A8494;
      --accent:#5B8CFF; --accent-hover:#7AA2FF; --accent-soft:rgba(91,140,255,.14); --on-accent:#0C0E12;
      --ok:#47CD89; --ok-soft:rgba(71,205,137,.12); --warn:#F5B546; --warn-soft:rgba(245,181,70,.12); --bad:#F97066; --bad-soft:rgba(249,112,102,.12);
      --shadow:none; --pop:0 12px 32px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0C0E12; --panel:#14171D; --sunken:#1A1E26; --photo:#1F242D;
    --line:#262B35; --line-strong:#353C48;
    --text:#F2F4F7; --text-2:#B4BCC8; --text-3:#7A8494;
    --accent:#5B8CFF; --accent-hover:#7AA2FF; --accent-soft:rgba(91,140,255,.14); --on-accent:#0C0E12;
    --ok:#47CD89; --ok-soft:rgba(71,205,137,.12); --warn:#F5B546; --warn-soft:rgba(245,181,70,.12); --bad:#F97066; --bad-soft:rgba(249,112,102,.12);
    --shadow:none; --pop:0 12px 32px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
  h1{font-size:20px} h2{font-size:17px} h3{font-size:14px}
  .muted{color:var(--text-2)} .faint{color:var(--text-3)}
  .mono{font-family:var(--mono);font-size:12px}
  .num{font-variant-numeric:tabular-nums}

  /* top bar */
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
  .topbar .in{max-width:1280px;margin:0 auto;padding-inline:20px;display:flex;align-items:center;gap:28px;height:56px}
  .brand{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
  .brand b{color:var(--accent)}
  .tabs{display:flex;gap:2px;height:100%;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:0 12px;height:100%;color:var(--text-2);font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .tabs button:hover{color:var(--text)}
  .tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
  .badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
  .badge.zero{background:var(--sunken);color:var(--text-3)}
  .venue{margin-left:auto;color:var(--text-3);font-size:13px;white-space:nowrap}
  @media (max-width:640px){.venue{display:none}.topbar .in{gap:14px;padding-inline:16px}}

  main{max-width:1280px;margin:0 auto;padding:24px 20px 96px}
  @media (max-width:640px){main{padding:16px 16px 96px}}
  .view{display:grid;gap:18px}
  .view > *,.setgrid > *{min-width:0}
  .pagehead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between}
  .pagehead p{margin:4px 0 0;color:var(--text-2);font-size:13px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}

  /* controls */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
  .btn:hover{background:var(--sunken)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn.approve{background:var(--ok);border-color:var(--ok);color:var(--panel)}
  .btn.approve:hover{filter:brightness(1.08)}
  .btn.deny{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line-strong))}
  .btn.deny:hover{background:var(--bad-soft)}
  .btn.ghost{border-color:transparent;background:none;color:var(--text-2)}
  .btn.ghost:hover{background:var(--sunken);color:var(--text)}
  .btn.sm{height:30px;padding:0 10px;font-size:13px}
  .btn.lg{height:44px;padding:0 18px;font-size:15px}
  .btn.block{width:100%}
  .btn kbd{font-family:var(--mono);font-size:11px;line-height:16px;padding:0 5px;border-radius:4px;background:color-mix(in srgb,currentColor 14%,transparent);opacity:.9}
  @media (hover:none){.btn kbd,.popwrap,.chip kbd{display:none}}
  .seg{display:inline-flex;background:var(--sunken);border-radius:8px;padding:2px}
  .seg button{border:0;background:none;height:28px;padding:0 10px;border-radius:6px;font-size:13px;color:var(--text-2)}
  .seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:var(--shadow);font-weight:500}
  select,input[type=text]{height:34px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);padding:0 10px;width:100%;min-width:0}
  input[type=range]{accent-color:var(--accent)}

  .pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:500;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.ok{color:var(--ok);background:var(--ok-soft)}
  .pill.warn{color:var(--warn);background:var(--warn-soft)}
  .pill.bad{color:var(--bad);background:var(--bad-soft)}
  .pill.info{color:var(--accent);background:var(--accent-soft)}
  .pill.idle{color:var(--text-2);background:var(--sunken)}

  .ph{border-radius:8px;overflow:hidden;background:var(--photo);position:relative;flex:none}
  .ph svg,.ph img{display:block;width:100%;height:100%;object-fit:cover}
  .ph-empty{width:100%;height:100%;display:grid;place-items:center;color:var(--text-3)}
  .ph-empty svg{width:40%;height:40%}

  /* review queue */
  .subnav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .subnav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 10px 11px;color:var(--text-2);font-weight:500;display:flex;gap:6px;align-items:center;white-space:nowrap}
  .subnav button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text)}
  .subnav .n{color:var(--text-3);font-variant-numeric:tabular-nums;font-weight:400}
  .qgrid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:900px){.qgrid{grid-template-columns:minmax(0,1fr)}}
  .qlist{list-style:none;margin:0;padding:6px;display:grid;gap:2px}
  .qrow{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border:0;border-radius:8px;background:none;text-align:left}
  .qrow:hover{background:var(--sunken)}
  .qrow[aria-current="true"]{background:var(--accent-soft)}
  .qrow .ph{width:44px;height:54px;border-radius:6px}
  .qrow .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qrow .fl{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--warn)}
  .dot.bad{background:var(--bad)}
  .qrow .age{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;align-self:start;padding-top:2px}
  .newtag{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}

  .detail{display:grid}
  .dtop{padding:18px 20px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line)}
  .dtop .sub{color:var(--text-2);font-size:13px;margin-top:2px}
  .dmain{padding:20px;display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:24px}
  @media (max-width:640px){.dmain{grid-template-columns:minmax(0,1fr)}}
  .photos{display:grid;gap:10px;align-content:start}
  .photos.pair{grid-template-columns:1fr 1fr}
  .frame{display:grid;gap:6px}
  .frame .cap{font-size:12px;color:var(--text-3)}
  .big{aspect-ratio:4/5;width:100%;border-radius:10px;overflow:hidden;background:var(--photo);position:relative}
  .big .inner{width:100%;height:100%;transition:transform .2s ease}
  .big svg,.big img{display:block;width:100%;height:100%;object-fit:cover}
  .cropbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .cropbar input{flex:1;min-width:80px}
  .flagnote{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--text);font-size:13px}
  .flagnote.bad{background:var(--bad-soft)}
  .flagnote svg{flex:none;width:16px;height:16px;color:var(--warn);margin-top:1px}
  .flagnote.bad svg{color:var(--bad)}
  .checks{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13px}
  .checks li{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center}
  .checks .v{color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums}
  .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
  .ic svg{width:11px;height:11px}
  .ic.ok{background:var(--ok-soft);color:var(--ok)}
  .ic.warn{background:var(--warn-soft);color:var(--warn)}
  .ic.bad{background:var(--bad-soft);color:var(--bad)}
  .ic.wait{background:var(--sunken);color:var(--text-3)}
  .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin:0;font-size:13px}
  .kv dt{color:var(--text-3)}
  .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
  .sect{display:grid;gap:10px}
  .sectlabel{font-size:12px;font-weight:500;color:var(--text-3)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 8px;border-radius:16px;border:1px solid var(--line-strong);background:var(--panel);font-size:13px;color:var(--text-2)}
  .chip:hover{border-color:var(--text-3)}
  .chip kbd{font-family:var(--mono);font-size:10px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--text-3)}
  .chip[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
  .chip[aria-pressed="true"] kbd{background:var(--bad);color:var(--panel)}
  .chips.need .chip{border-color:var(--bad)}
  .preview{font-size:13px;color:var(--text-2);padding:10px 12px;border-radius:8px;background:var(--sunken)}
  .preview b{color:var(--text);font-weight:500}
  .dfoot{position:sticky;bottom:0;z-index:5;padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border-radius:0 0 10px 10px;box-shadow:0 -1px 0 var(--line)}
  .dfoot .sp{flex:1}
  .shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .leave{animation:leave .22s ease forwards}
  @keyframes leave{to{opacity:0;transform:translateX(24px)}}

  .empty{padding:56px 24px;display:grid;gap:10px;justify-items:center;text-align:center}
  .empty .ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
  .empty .ico svg{width:22px;height:22px}
  .empty p{margin:0;color:var(--text-2)}

  .spotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:16px}
  .spot{border:0;background:none;padding:0;display:grid;gap:6px;text-align:left;font-size:13px}
  .spot .ph{aspect-ratio:4/5;border-radius:8px;outline:2px solid transparent;outline-offset:2px;transition:outline-color .12s}
  .spot:hover .ph{outline-color:var(--line-strong)}
  .spot[aria-pressed="true"] .ph{outline-color:var(--bad)}
  .spot .mark{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center}
  .spot .mark svg{width:12px;height:12px}
  .spot .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spotfoot{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}

  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-weight:500;color:var(--text-3);font-size:12px;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  .who{display:flex;align-items:center;gap:10px;min-width:160px}
  .who .ph{width:32px;height:40px;border-radius:5px}

  /* shortcuts popover */
  .popwrap{position:relative}
  .pop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop);padding:12px 14px;display:grid;grid-template-columns:auto auto;gap:8px 18px;font-size:13px;white-space:nowrap}
  .pop kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--sunken)}

  /* member portal */
  .portal{display:flex;justify-content:center}
  .phone{width:100%;max-width:390px;border:1px solid var(--line);border-radius:28px;background:var(--panel);box-shadow:var(--pop);overflow:hidden;display:flex;flex-direction:column;min-height:700px}
  @media (max-width:480px){.phone{border-radius:16px;min-height:0;box-shadow:none}}
  .pbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
  .pbar b{font-size:15px}
  .pbody{padding:20px 18px 24px;display:grid;gap:16px;align-content:start;flex:1}
  .back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0;color:var(--accent);font-weight:500;justify-self:start}
  .back svg{width:16px;height:16px}
  .mcard{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);width:100%;text-align:left}
  button.mcard:hover{border-color:var(--line-strong);background:var(--sunken)}
  .mcard .ph{width:52px;height:64px}
  .mcard .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .mcard .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mcard .meta{font-size:12px;color:var(--text-3)}
  .mcard .msg{font-size:13px;color:var(--text-2);margin-top:6px}
  .mcard .cta{margin-top:8px;color:var(--accent);font-weight:500;font-size:13px}
  .guide{position:relative;aspect-ratio:4/5;width:100%;max-width:250px;justify-self:center;border-radius:16px;overflow:hidden;background:var(--photo)}
  .guide img,.guide svg{display:block;width:100%;height:100%;object-fit:cover}
  .guide .oval{position:absolute;left:21%;right:21%;top:11%;bottom:28%;border:2px dashed color-mix(in srgb,var(--text-3) 80%,transparent);border-radius:50%}
  .guide .scan{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,color-mix(in srgb,var(--accent) 30%,transparent) 50%,transparent 100%);background-size:100% 40%;background-repeat:no-repeat;animation:scan 1.2s linear infinite}
  @keyframes scan{from{background-position:0 -40%}to{background-position:0 140%}}
  .tips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-2)}
  .tips span{display:inline-flex;align-items:center;gap:5px}
  .tips svg{width:13px;height:13px;color:var(--ok)}
  .banner{border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:13px}
  .banner b{font-size:14px}
  .banner.ok{background:var(--ok-soft)} .banner.ok b{color:var(--ok)}
  .banner.warn{background:var(--warn-soft)} .banner.warn b{color:var(--warn)}
  .banner.bad{background:var(--bad-soft)} .banner.bad b{color:var(--bad)}
  .banner.info{background:var(--accent-soft)} .banner.info b{color:var(--accent)}
  .samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .sample{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:5px;display:grid;gap:4px;font-size:11px;color:var(--text-2);text-align:center}
  .sample:hover{border-color:var(--accent)}
  .sample .ph{aspect-ratio:4/5;border-radius:6px}
  .loading{display:flex;justify-content:center;align-items:center;gap:10px;font-size:13px;color:var(--text-2)}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* gate */
  .gategrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:900px){.gategrid{grid-template-columns:minmax(0,1fr)}}
  .scanbox{padding:12px;display:grid;gap:10px}
  .scanlist{list-style:none;margin:0;padding:0 6px 6px;display:grid;gap:2px}
  .scanrow{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border:0;border-radius:8px;background:none;text-align:left}
  .scanrow:hover{background:var(--sunken)}
  .scanrow[aria-current="true"]{background:var(--accent-soft)}
  .scanrow .ph{width:36px;height:44px;border-radius:5px}
  .scanrow .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scanrow .sub{font-size:12px;color:var(--text-3)}
  .result{overflow:hidden}
  .rbar{padding:22px 24px;display:flex;gap:16px;align-items:center}
  .rbar .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
  .rbar .ico svg{width:22px;height:22px}
  .rbar .t{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .rbar .s{font-size:14px;margin-top:2px}
  .rbar.ok{background:var(--ok-soft)} .rbar.ok .ico{background:var(--ok);color:var(--panel)} .rbar.ok .t{color:var(--ok)}
  .rbar.warn{background:var(--warn-soft)} .rbar.warn .ico{background:var(--warn);color:var(--panel)} .rbar.warn .t{color:var(--warn)}
  .rbar.info{background:var(--accent-soft)} .rbar.info .ico{background:var(--accent);color:var(--on-accent)} .rbar.info .t{color:var(--accent)}
  .rbody{padding:24px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;align-items:start}
  .rbody .ph{width:150px;height:188px;border-radius:10px}
  @media (max-width:520px){.rbody{grid-template-columns:minmax(0,1fr)}}
  .ractions{padding:0 24px 24px;display:flex;gap:10px;flex-wrap:wrap}
  .scanidle{padding:72px 24px;text-align:center;color:var(--text-3);display:grid;gap:10px;justify-items:center}

  /* ---------- real photo checks (face-api, runs in the browser) ---------- */
  const FACEAPI_SRC = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js';
  const MODEL_URL = 'models';
  // Thresholds tuned on a small set of test photos; treat as a starting point.
  const T = {
    minScore:.45, otherFace:.2,
    faceBad:70, faceWarn:110,
    yawBad:.32, yawWarn:.2, rollWarn:18,
    lumBad:[50, 235], lumWarn:[72, 220],
    sharpBad:28, sharpWarn:55,
    eyeBad:.4, eyeSdBad:18, eyeWarn:.5, eyeSdWarn:26, eyeDark:.4,
    hatWarn:65, imageDark:50
  };
  let faceReady = null;
  function loadFace(){
    if (faceReady) return faceReady;
    faceReady = (window.faceapi ? Promise.resolve() : new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = FACEAPI_SRC; s.onload = res; s.onerror = () => rej(new Error('Face detection script did not load'));
      document.head.appendChild(s);
    })).then(async () => {
      // The default wasm backend fetches extra files from the CDN, which the artifact sandbox blocks.
      const tf = faceapi.tf;
      let ok = false;
      try { ok = await tf.setBackend('webgl'); } catch (_) {}
      if (!ok) await tf.setBackend('cpu');
      await tf.ready();
      await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
    });
    faceReady.catch(() => { faceReady = null; });
    return faceReady;
  }
  function fileToCanvas(file){
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const sc = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file isn\'t an image we can read. Try a JPG or PNG.')); };
      img.src = url;
    });
  }
  async function analyzePhoto(cv){
    await loadFace();
    const W = cv.width, H = cv.height;
    const px = cv.getContext('2d', {willReadFrequently:true}).getImageData(0, 0, W, H).data;
    const stats = (x, y, w, h) => {
      const x1 = Math.max(0, Math.round(x)), y1 = Math.max(0, Math.round(y));
      const x2 = Math.min(W, Math.round(x + w)), y2 = Math.min(H, Math.round(y + h));
      let n = 0, s = 0, s2 = 0, r = 0, g = 0, b = 0;
      for (let j = y1; j < y2; j++) for (let i = x1; i < x2; i++) {
        const k = (j * W + i) * 4, L = .299 * px[k] + .587 * px[k + 1] + .114 * px[k + 2];
        s += L; s2 += L * L; r += px[k]; g += px[k + 1]; b += px[k + 2]; n++;
      }
      if (!n) return null;
      const m = s / n;
      return {m, sd:Math.sqrt(Math.max(0, s2 / n - m * m)), r:r / n, g:g / n, b:b / n, n};
    };
    const out = {checks:[], metrics:{}, crop:null, orig:cv.toDataURL('image/jpeg', .82)};
    const add = (key, label, status, value, guest, reason) => out.checks.push({key, label, status, value:value || '', guest, reason});
    const dets = await faceapi.detectAllFaces(cv, new faceapi.SsdMobilenetv1Options({minConfidence:T.minScore})).withFaceLandmarks();
    out.metrics.backend = faceapi.tf.getBackend();
    out.metrics['faces detected'] = dets.length;
    if (!dets.length) {
      // Dark or blurry photos usually fail here, so point the guest at the likely cause.
      const all = stats(0, 0, W, H);
      out.metrics['image brightness'] = all.m.toFixed(0);
      const msg = all.m < T.imageDark ? 'We couldn\'t find a face, probably because the photo is too dark. Try facing a window or a lamp.'
        : 'We couldn\'t find a face. Use a sharp, front-facing photo where your head and shoulders fill most of the frame.';
      add('face', 'Face found', 'bad', 'none', msg, all.m < T.imageDark ? 'dark' : 'frame');
      return out;
    }
    dets.sort((a, b) => b.detection.box.area - a.detection.box.area);
    const main = dets[0], box = main.detection.box, P = main.landmarks.positions;
    add('face', 'Face found', 'ok', Math.round(main.detection.score * 100) + '%');

    const others = dets.slice(1).filter(d => d.detection.box.area > box.area * T.otherFace).length;
    add('one', 'Only one person', others ? 'bad' : 'ok', others ? (others + 1) + ' faces' : '', 'Only the member should be in the photo.', 'group');

    const mean = (a, b) => { let x = 0, y = 0; for (let i = a; i <= b; i++) { x += P[i].x; y += P[i].y; } const n = b - a + 1; return {x:x / n, y:y / n}; };
    const eL = mean(36, 41), eR = mean(42, 47), nose = P[30];
    const iod = Math.hypot(eR.x - eL.x, eR.y - eL.y), mid = {x:(eL.x + eR.x) / 2, y:(eL.y + eR.y) / 2};

    const yaw = (nose.x - mid.x) / iod, roll = Math.atan2(eR.y - eL.y, eR.x - eL.x) * 180 / Math.PI;
    out.metrics.yaw = yaw.toFixed(2); out.metrics['roll°'] = roll.toFixed(0);
    const poseSt = Math.abs(yaw) > T.yawBad ? 'bad' : (Math.abs(yaw) > T.yawWarn || Math.abs(roll) > T.rollWarn) ? 'warn' : 'ok';
    add('pose', 'Facing the camera', poseSt, poseSt === 'ok' ? '' : (Math.abs(yaw) > T.yawWarn ? 'turned' : 'tilted'), 'Look straight at the camera with your head level.', 'frame');

    out.metrics['face px'] = Math.round(box.height);
    const sizeSt = box.height < T.faceBad ? 'bad' : box.height < T.faceWarn ? 'warn' : 'ok';
    add('size', 'Face big enough', sizeSt, sizeSt === 'ok' ? '' : Math.round(box.height) + 'px', 'Move closer, or use a higher-resolution photo, so your face fills the frame.', 'frame');

    // eyes vs cheeks: sunglasses make the eye area dark and flat
    const eyeStat = (a, b, c) => {
      const ew = Math.hypot(P[b].x - P[a].x, P[b].y - P[a].y), e = mean(a, a + 5);
      const eye = stats(e.x - ew * .65, e.y - ew * .35, ew * 1.3, ew * .7);
      const cheek = stats(e.x - ew * .45, e.y + iod * .55 - ew * .25, ew * .9, ew * .5);
      return {eye, cheek};
    };
    const L1 = eyeStat(36, 39), R1 = eyeStat(42, 45);
    let eyeSt = 'ok', ratio = 1, eyeSd = 99;
    if (L1.eye && R1.eye && L1.cheek && R1.cheek) {
      ratio = (L1.eye.m + R1.eye.m) / (L1.cheek.m + R1.cheek.m);
      eyeSd = (L1.eye.sd + R1.eye.sd) / 2;
      eyeSt = (ratio < T.eyeBad && eyeSd < T.eyeSdBad) ? 'bad' : ((ratio < T.eyeWarn && eyeSd < T.eyeSdWarn) || ratio < T.eyeDark) ? 'warn' : 'ok';
    }
    out.metrics['eye/cheek'] = ratio.toFixed(2); out.metrics['eye sd'] = eyeSd.toFixed(0);
    add('eyes', 'Eyes visible (no sunglasses)', eyeSt, eyeSt === 'ok' ? '' : 'eye area dark', MSG.eyes, 'glasses');

    // lighting on the cheeks and nose
    const skin = stats(eL.x - iod * .3, mid.y + iod * .15, iod * 1.6, Math.max(4, P[57].y - mid.y - iod * .15));
    const lum = skin ? skin.m : 0;
    out.metrics['face brightness'] = lum.toFixed(0);
    const lumSt = (lum < T.lumBad[0] || lum > T.lumBad[1]) ? 'bad' : (lum < T.lumWarn[0] || lum > T.lumWarn[1]) ? 'warn' : 'ok';
    add('light', 'Good lighting', lumSt, lumSt === 'ok' ? '' : (lum < 128 ? 'dark' : 'overexposed'), lum < 128 ? MSG.light : 'Your photo is too bright. Move out of direct sunlight or turn off the flash.', 'dark');

    // sharpness: variance of the Laplacian on the face, normalised to 128px wide
    const tw = 128, th = Math.max(8, Math.round(128 * box.height / box.width));
    const tc = document.createElement('canvas'); tc.width = tw; tc.height = th;
    const tctx = tc.getContext('2d', {willReadFrequently:true});
    tctx.drawImage(cv, box.x, box.y, box.width, box.height, 0, 0, tw, th);
    const td = tctx.getImageData(0, 0, tw, th).data, gray = new Float32Array(tw * th);
    for (let i = 0; i < tw * th; i++) gray[i] = .299 * td[i * 4] + .587 * td[i * 4 + 1] + .114 * td[i * 4 + 2];
    let ls = 0, ls2 = 0, ln = 0;
    for (let y = 1; y < th - 1; y++) for (let x = 1; x < tw - 1; x++) {
      const i = y * tw + x, v = gray[i - 1] + gray[i + 1] + gray[i - tw] + gray[i + tw] - 4 * gray[i];
      ls += v; ls2 += v * v; ln++;
    }
    const sharp = ln ? ls2 / ln - (ls / ln) ** 2 : 0;
    out.metrics.sharpness = sharp.toFixed(0);
    const sharpSt = sharp < T.sharpBad ? 'bad' : sharp < T.sharpWarn ? 'warn' : 'ok';
    add('sharp', 'Sharp', sharpSt, sharpSt === 'ok' ? '' : 'soft', MSG.sharp, 'blur');

    // head covering: forehead colour vs cheek colour (hair over the forehead also trips this, so it only ever flags for staff)
    const browTop = Math.min(...P.slice(17, 27).map(p => p.y)), fh = nose.y - browTop;
    const fore = stats(P[19].x, browTop - fh * .55, P[24].x - P[19].x, fh * .4);
    let hatSt = 'ok', dist = 0;
    if (fore && skin && fore.n > 20) {
      dist = Math.hypot(fore.r - skin.r, fore.g - skin.g, fore.b - skin.b);
      hatSt = dist > T.hatWarn ? 'warn' : 'ok';
    }
    out.metrics['forehead colour diff'] = dist.toFixed(0);
    add('hat', 'No head covering', hatSt, hatSt === 'ok' ? '' : 'unsure', MSG.hat, 'hat');

    // lighting and sharpness come first so a dark or blurry photo isn't reported as sunglasses
    const ORDER = ['face', 'one', 'size', 'pose', 'light', 'sharp', 'eyes', 'hat'];
    out.checks.sort((a, b) => ORDER.indexOf(a.key) - ORDER.indexOf(b.key));

    // auto-crop to a 4:5 head-and-shoulders frame
    let ch = box.height * 2.3, cw = ch * .8;
    if (ch > H) { ch = H; cw = ch * .8; }

    const cy = Math.min(Math.max(box.y - box.height * .55, 0), H - ch);
    const oc = document.createElement('canvas'); oc.width = 400; oc.height = 500;

  }
  window.__photoChecks = {analyzePhoto, loadFace, T};


  /* ---------- outcome rules ---------- */
  function outcome(analysis, product){
    const ps = S.products[product];
    if (!ps.validation) return {result:'approved'};
    const retake = analysis.checks.find(c => c.status !== 'ok' && S.checks[c.key][c.status === 'bad' ? 'fail' : 'unsure'] === 'retake');
    if (retake) return {result:'retake', check:retake};
    const review = analysis.checks.filter(c => c.status !== 'ok' && S.checks[c.key][c.status === 'bad' ? 'fail' : 'unsure'] === 'review');
    if (ps.mode === 'gate') return {result:'provisional'};
    if (ps.mode === 'manual' || review.length) return {result:'review', flagged:review};
    return {result:'approved'};
  }

  /* ---------- member portal ---------- */
  const PSTATUS = {
    approved:['ok', 'Active'], provisional:['ok', 'Active'],
    awaiting:['idle', 'Photo needed'], denied:['bad', 'Retake needed'], review:['info', 'In review']
  };
  const reasonText = m => (m.reasons || []).map(id => (reasonById(id) || {}).guest).filter(Boolean).join(' ');

  function renderPortal(){
    const P = S.portal;
    let body;
    if (P.screen === 'home') {
      body = `<div><h2>Rivera household</h2><div class="faint" style="font-size:13px;margin-top:2px">Season Pass – Gold 2027</div></div>
        ${S.members.map(m => {
          const [cls, lab] = PSTATUS[m.status];
          const act = m.status === 'awaiting' || m.status === 'denied';
          const msg = m.status === 'denied' ? reasonText(m) : m.status === 'review' ? 'We\'ll email you when it\'s approved.' : m.status === 'awaiting' ? 'Add a photo to activate this pass.' : '';
          const cta = m.status === 'denied' ? 'Retake photo' : m.status === 'awaiting' ? 'Add photo' : '';
          return `<${act ? 'button' : 'div'} class="mcard" ${act ? `data-act="p-open" data-id="${m.id}"` : ''}>
            <span class="ph">${portrait(m.photo, m.name)}</span>
            <span style="min-width:0;display:grid">
              <span class="row1"><span class="nm">${esc(m.name)}</span><span class="pill ${cls}">${lab}</span></span>
              <span class="meta">${esc(m.role)}</span>
              ${msg ? `<span class="msg">${esc(msg)}</span>` : ''}
              ${cta ? `<span class="cta">${cta} ›</span>` : ''}
            </span></${act ? 'button' : 'div'}>`;
        }).join('')}`;
    } else {
      const m = memberById(P.active);
      let inner;
      if (!P.phase) {
        inner = `${m.status === 'denied' ? `<div class="banner bad"><b>Photo not approved</b><span>${esc(reasonText(m))}</span></div>` : ''}
          <div class="guide"><span class="ph-empty" style="color:var(--text-3)">${I.camera}</span><span class="oval"></span></div>
          <div class="tips"><span>${I.check}Face the camera</span><span>${I.check}No sunglasses or hats</span><span>${I.check}Good light</span></div>
          ${P.error ? `<div class="banner bad"><span>${esc(P.error)}</span></div>` : ''}
          <label class="btn primary lg block" for="p-file">${I.camera.replace('<svg', '<svg width="18" height="18"')} Take or choose photo</label>
          <input type="file" id="p-file" accept="image/*" hidden>
          <details><summary class="faint" style="cursor:pointer;font-size:13px;text-align:center;list-style:none">Use a sample photo</summary>
            <div class="samples" style="margin-top:10px">${SAMPLES.map(s => `<button class="sample" data-act="p-sample" data-k="${s.key}"><span class="ph">${portrait(s.photo, s.label)}</span>${s.label}</button>`).join('')}</div>
          </details>`;
      } else {
        const a = P.analysis;
        const img = a ? a.photo : (P.preview ? {img:P.preview} : null);
        const shown = a ? a.checks.slice(0, P.step) : [];
        const pending = a ? a.checks.slice(P.step) : [];
        let res = '';
        if (P.result) {
          const o = P.result, first = m.name.split(' ')[0];
          if (o.result === 'retake') res = `<div class="banner bad"><b>Let's try that again</b><span>${esc(o.check.guest || MSG[o.check.key])}</span></div><button class="btn primary lg block" data-act="p-again">Retake photo</button>`;
          else if (o.result === 'approved') res = `<div class="banner ok"><b>${esc(first)}'s pass is active</b><span>Photo approved.</span></div><button class="btn primary lg block" data-act="p-home">Done</button>`;
          else if (o.result === 'review') res = `<div class="banner info"><b>Photo submitted</b><span>We'll email you once it's approved, usually within a few hours.</span></div><button class="btn primary lg block" data-act="p-home">Done</button>`;
          else res = `<div class="banner ok"><b>${esc(first)}'s pass is active</b><span>Staff will confirm the photo on your first visit.</span></div><button class="btn primary lg block" data-act="p-home">Done</button>`;
        }
        inner = `<div class="guide">${portrait(img, 'Your photo')}${!P.result ? '<span class="scan"></span>' : ''}</div>
          ${!a ? `<div class="loading"><span class="spinner"></span>${P.model === 'loading' ? 'Getting ready…' : 'Checking photo…'}</div>` : ''}
          ${a ? `<ul class="checks">${shown.map(c => checkRow(c.status, CHECK_LABEL[c.key], c.status === 'ok' ? '' : c.value)).join('')}${!P.result ? pending.map(c => checkRow('wait', CHECK_LABEL[c.key], '')).join('') : ''}</ul>` : ''}
          ${res}`;
      }
      body = `<button class="back" data-act="p-home">${I.left} Back</button><div><h2>${esc(m.name)}</h2><div class="faint" style="font-size:13px;margin-top:2px">${esc(m.product)}</div></div>${inner}`;
    }
    $('#v-portal').innerHTML = `<div class="portal"><div class="phone"><div class="pbar"><b>Lagoon</b><span class="faint" style="font-size:13px">My account</span></div><div class="pbody">${body}</div></div></div>`;
  }

  function sampleAnalysis(s){
    return {photo:s.photo, checks:CHECKS.map(c => ({key:c.key, status:s.st[c.key] || 'ok', value:s.st[c.key] ? (s.st[c.key] === 'bad' ? 'failed' : 'unsure') : '', guest:MSG[c.key]}))};
  }
  let upSeq = 0;
  function finishCheck(a){
    const P = S.portal, m = memberById(P.active);
    P.analysis = a; P.step = 0; P.result = null;
    const o = outcome(a, m.product);
    const tick = () => {
      if (S.portal.active !== m.id || S.portal.analysis !== a) return;
      P.step++;
      if (P.step >= a.checks.length) {
        P.result = o;
        if (o.result === 'retake') S.stats.returned++;
        else {
          m.photo = a.photo; delete m.reasons;
          m.status = o.result === 'approved' ? 'approved' : o.result;
          if (o.result === 'approved') S.stats.auto++;
          if (o.result === 'review') queueFromPortal(m, a, o.flagged || []);
        }
        renderPortal(); renderQueue(); renderGate();
        return;
      }
      renderPortal();
      setTimeout(tick, 140);
    };
    renderPortal();
    setTimeout(tick, 140);
  }
  function queueFromPortal(m, a, flagged){
    const id = 'u' + (++upSeq), f = flagged[0];
    const item = {id, memberId:m.id, name:m.name, age:m.role, product:m.product, order:'RR-41901' + upSeq, household:'Rivera · 3 members', by:'Alex Rivera', mins:0,
      photo:a.photo, sev:'warn',
      flag: f ? CHECK_LABEL[f.key] + (f.value ? ' · ' + f.value : '') : 'Manual review',
      note: f ? 'Unsure: ' + flagged.map(c => CHECK_LABEL[c.key].toLowerCase()).join(', ') + '.' : 'All checks passed. This product reviews every photo.',
      checks:a.checks.map(c => [c.status, CHECK_LABEL[c.key], c.status === 'ok' ? '' : c.value]),
      suggest:[...new Set(flagged.map(c => CHECK_REASON[c.key]))]};
    S.queue.unshift(item); initItem(item); S.sel = 0;
  }
  async function runUpload(file){
    const P = S.portal;
    P.error = null;
    let cv;
    try { cv = await fileToCanvas(file); } catch (err) { P.error = err.message; renderPortal(); return; }
    const activeId = P.active;
    P.phase = 'checking'; P.analysis = null; P.result = null; P.preview = cv.toDataURL('image/jpeg', .7);
    if (!window.faceapi) P.model = 'loading';
    renderPortal();
    let a;
    try { a = await analyzePhoto(cv); P.model = 'ready'; }
    catch (err) { P.phase = null; P.error = 'We couldn\'t check your photo. Try again, or use a sample photo.'; renderPortal(); return; }
    if (S.portal.active !== activeId) return;
    a.photo = {img:a.crop || a.orig, orig:a.orig};
    finishCheck(a);
  }

  /* ---------- gate ---------- */
  const gst = m => m.status === 'provisional' ? ['info', 'First visit'] : PSTATUS[m.status];
  function renderGate(){
    const list = allMembers();
    const m = list.find(x => x.id === S.gate.sel);
    let res;
    if (!m) res = `<div class="scanidle">${I.scan}<span>Scan a pass</span></div>`;
    else {
      let bar, acts = '';
      if (m.status === 'approved') bar = `<div class="rbar ok"><span class="ico">${I.check}</span><div><div class="t">Admit</div><div class="s muted">${S.gate.note ? esc(S.gate.note) : 'Photo on file'}</div></div></div>`;
      else if (m.status === 'provisional') {
        bar = `<div class="rbar info"><span class="ico">${I.person}</span><div><div class="t">Check photo</div><div class="s muted">First visit. Confirm the guest matches the photo.</div></div></div>`;
        acts = `<div class="ractions"><button class="btn approve lg" data-act="g-match">Matches · admit</button><button class="btn deny lg" data-act="g-nomatch">Doesn't match</button></div>`;
      } else {
        const why = {awaiting:'No photo uploaded', denied:'Photo was not approved', review:'Photo waiting for review'}[m.status];
        bar = `<div class="rbar warn"><span class="ico">${I.camera}</span><div><div class="t">Photo needed</div><div class="s muted">${why}</div></div></div>`;
        acts = `<div class="ractions"><button class="btn primary lg" data-act="g-capture">${I.camera.replace('<svg', '<svg width="18" height="18"')} Take photo</button></div>`;
      }
      res = `${bar}<div class="rbody"><span class="ph ${S.gate.flash ? 'flash' : ''}">${portrait(m.photo, m.name)}</span>
        <dl class="kv"><dt>Name</dt><dd><b>${esc(m.name)}</b></dd><dt>Type</dt><dd>${esc(m.role)}</dd><dt>Pass</dt><dd>${esc(m.product)}</dd><dt>Status</dt><dd><span class="pill ${gst(m)[0]}">${gst(m)[1]}</span></dd></dl></div>${acts}`;
    }
    $('#v-gate').innerHTML = `<div class="pagehead"><div><h1>Gate</h1><p>Main entrance · Lane 2</p></div></div>
      <div class="gategrid">
        <div class="panel"><div class="scanbox"><input type="text" id="g-search" placeholder="Scan or search passes" aria-label="Scan or search passes" value="${esc(S.gate.q || '')}"></div>
          <ul class="scanlist">${list.filter(x => !S.gate.q || x.name.toLowerCase().includes(S.gate.q.toLowerCase())).map(x => `<li><button class="scanrow" data-act="g-scan" data-id="${x.id}" aria-current="${x.id === S.gate.sel}"><span class="ph">${portrait(x.photo, x.name)}</span><span style="min-width:0;display:grid"><span class="nm">${esc(x.name)}</span><span class="sub">${esc(x.product)}</span></span><span class="pill ${gst(x)[0]}">${gst(x)[1]}</span></button></li>`).join('')}</ul>
        </div>
        <div class="panel result" aria-live="polite">${res}</div>
      </div>`;
    S.gate.flash = false;
  }

  /* ---------- settings ---------- */
  function renderSettings(){
    const sel = (id, v, opts, dim) => `<select id="${id}" ${dim ? 'class="dim" tabindex="-1"' : ''}>${Object.entries(opts).map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
    $('#v-settings').innerHTML = `<div class="pagehead"><div><h1>Photo settings</h1><p>Changes save automatically.</p></div></div>
      <div class="setgrid">
        <div class="panel"><div class="sethead"><h3>Memberships</h3></div>
          <div class="tablewrap"><table><thead><tr><th>Product</th><th>Photo approval</th><th>How photos are approved</th></tr></thead><tbody>
            ${PRODUCTS.map((p, i) => { const ps = S.products[p]; return `<tr><td>${esc(p)}</td><td><label class="switch"><input type="checkbox" id="pv-${i}" ${ps.validation ? 'checked' : ''} aria-label="Photo approval for ${esc(p)}"><span></span></label></td><td>${sel('pm-' + i, ps.mode, MODES, !ps.validation)}</td></tr>`; }).join('')}
          </tbody></table></div></div>
        <div class="panel"><div class="sethead"><h3>Automatic checks</h3></div>
          <div class="tablewrap"><table><thead><tr><th>Check</th><th>When it fails</th><th>When unsure</th></tr></thead><tbody>
            ${CHECKS.map(c => `<tr><td>${c.label}</td><td>${sel('cf-' + c.key, S.checks[c.key].fail, ACTIONS)}</td><td>${sel('cu-' + c.key, S.checks[c.key].unsure, ACTIONS)}</td></tr>`).join('')}
          </tbody></table></div></div>
        <div class="panel"><div class="sethead"><h3>Review</h3></div>
          <div class="optrow"><div class="l">Spot-check auto-approved photos<small>Daily random sample</small></div><select id="o-spot" style="width:110px">${[0, 2, 5, 10, 20].map(v => `<option value="${v}" ${v === S.opts.spot ? 'selected' : ''}>${v ? v + '%' : 'Off'}</option>`).join('')}</select></div>
          <div class="optrow"><div class="l">Crop photos to card size</div><label class="switch"><input type="checkbox" id="o-crop" ${S.opts.autocrop ? 'checked' : ''} aria-label="Crop photos to card size"><span></span></label></div>
          <div class="optrow"><div class="l">Reuse approved photos<small>For renewals and other memberships, up to 3 years</small></div><label class="switch"><input type="checkbox" id="o-reuse" ${S.opts.reuse ? 'checked' : ''} aria-label="Reuse approved photos"><span></span></label></div>
        </div>
        <div class="panel"><div class="sethead" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h3>Denial reasons</h3><button class="btn sm" data-act="r-add">Add reason</button></div>
          <div class="tablewrap"><table><thead><tr><th style="width:32%">Reason</th><th>Message to member</th><th></th></tr></thead><tbody>
            ${REASONS.map(r => `<tr class="reasonrow"><td><input type="text" id="rl-${r.id}" value="${esc(r.label)}" aria-label="Reason"></td><td><input type="text" id="rg-${r.id}" value="${esc(r.guest)}" aria-label="Message to member"></td><td><button class="iconbtn" data-act="r-del" data-id="${r.id}" aria-label="Delete ${esc(r.label)}">${I.trash}</button></td></tr>`).join('')}
          </tbody></table></div></div>
      </div>`;
  }

  /* ---------- navigation ---------- */
  const VIEWS = ['queue', 'portal', 'gate', 'settings'];
  function show(v){
    if (!VIEWS.includes(v)) v = 'queue';
    S.view = v;
    VIEWS.forEach(k => { $('#v-' + k).hidden = k !== v; });
    document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === v));
    if (v === 'queue') renderQueue();
    if (v === 'portal') renderPortal();
    if (v === 'gate') renderGate();
    if (v === 'settings') renderSettings();
    try { history.replaceState(null, '', '#' + v); } catch (_) {}
  }

  document.addEventListener('click', e => {
    const tab = e.target.closest('#tabs button');
    if (tab) { show(tab.dataset.view); return; }
    if (S.keysOpen && !e.target.closest('.popwrap')) { S.keysOpen = false; renderQueue(); }
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act, q = S.queue[S.sel];
    switch (act) {
      case 'keys': S.keysOpen = !S.keysOpen; renderQueue(); break;
      case 'qtab': S.qtab = a.dataset.k; renderQueue(); break;
      case 'select': S.sel = +a.dataset.i; renderQueue(); if (matchMedia('(max-width:900px)').matches) { const d = $('.detail'); if (d) d.scrollIntoView({behavior:'smooth', block:'start'}); } break;
      case 'skip': S.sel = (S.sel + 1) % S.queue.length; renderQueue(); break;
      case 'crop': S.crop[q.id].orig = a.dataset.v === 'orig'; renderQueue(); break;
      case 'reason': { const s = S.reasons[q.id], r = a.dataset.r; s.has(r) ? s.delete(r) : s.add(r); renderQueue(); break; }
      case 'approve': decide('approve'); break;
      case 'deny': decide('deny'); break;
      case 'reopen': { const d = S.done.splice(+a.dataset.i, 1)[0]; reopenItem(d); toast(`${d.item.name} is back in review`, 'ok'); break; }
      case 'spotflag': S.spot.flags[a.dataset.i] = !S.spot.flags[a.dataset.i]; renderQueue(); break;
      case 'spotclear': S.spot.flags = {}; renderQueue(); break;
      case 'spotconfirm': {
        const fl = Object.keys(S.spot.flags).filter(k => S.spot.flags[k]).map(Number);
        fl.forEach(i => {
          const [n, p] = SPOT[i];
          const item = {id:'sp' + i, name:n, age:'Adult', product:'Season Pass – Gold 2027', order:'RR-41861' + i, household:n.split(' ')[1] + ' · 1 member', by:n, mins:95, photo:p, sev:'warn', flag:'Flagged in spot check', note:'Auto-approved earlier today. The pass stays active until you decide.', checks:CHECKS.map(c => ok(c.label)), suggest:[]};
          S.queue.push(item); initItem(item); S.stats.auto--;
        });
        S.spot.done = true;
        if (fl.length) { S.qtab = 'review'; S.sel = S.queue.length - fl.length; }
        renderQueue();
        toast(fl.length ? `${fl.length} photo${fl.length > 1 ? 's' : ''} sent to review` : 'Sample checked', 'ok');
        break;
      }
      case 'p-open': Object.assign(S.portal, {screen:'upload', active:a.dataset.id, phase:null, analysis:null, result:null, error:null}); renderPortal();
        if (!window.faceapi) loadFace().catch(() => {});
        break;
      case 'p-home': Object.assign(S.portal, {screen:'home', phase:null, analysis:null, result:null, error:null}); renderPortal(); break;
      case 'p-again': Object.assign(S.portal, {phase:null, analysis:null, result:null, error:null}); renderPortal(); break;
      case 'p-sample': { const s = SAMPLES.find(x => x.key === a.dataset.k); S.portal.phase = 'checking'; finishCheck(sampleAnalysis(s)); break; }
      case 'g-scan': S.gate.sel = a.dataset.id; S.gate.note = null; renderGate(); break;
      case 'g-capture': case 'g-match': {
        const m = memberById(S.gate.sel);
        if (act === 'g-capture') { if (!m.photo || m.status !== 'review') m.photo = SAMPLES[0].photo; S.gate.flash = true; S.gate.note = 'Photo taken at gate'; }
        else S.gate.note = 'Photo confirmed';
        const qi = S.queue.findIndex(x => x.memberId === m.id || x.id === m.queueId);
        if (qi > -1) S.queue.splice(qi, 1);
        m.status = 'approved'; delete m.reasons;
        renderGate(); renderPortal(); renderQueue();
        toast(`${m.name} admitted`, 'ok');
        break;
      }
      case 'g-nomatch': { const m = memberById(S.gate.sel); m.status = 'awaiting'; m.photo = null; renderGate(); renderPortal(); toast('Photo removed. Take a new one to admit.', 'warn'); break; }
      case 'r-add': { const id = 'r' + Date.now(); REASONS.push({id, label:'New reason', guest:''}); renderSettings(); const el = $('#rl-' + id); if (el) { el.focus(); el.select(); } break; }
      case 'r-del': { const i = REASONS.findIndex(r => r.id === a.dataset.id); if (i > -1) { const [r] = REASONS.splice(i, 1); Object.values(S.reasons).forEach(s => s.delete(r.id)); renderSettings(); toast(`Deleted "${r.label}"`, 'ok', () => { REASONS.splice(i, 0, r); renderSettings(); }); } break; }
    }
  });

  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'zoom') { const q = S.queue[S.sel]; S.crop[q.id].zoom = +t.value; const inner = t.closest('.detail').querySelectorAll('.big .inner'); inner[inner.length - 1].style.transform = `scale(${t.value})`; }
    if (t.id === 'g-search') { S.gate.q = t.value; const pos = t.selectionStart; renderGate(); const el = $('#g-search'); el.focus(); el.setSelectionRange(pos, pos); }
  });
  document.addEventListener('change', e => {
    const t = e.target, id = t.id || '';
    if (id === 'p-file' && t.files && t.files[0]) { runUpload(t.files[0]); t.value = ''; return; }
    let saved = true;
    if (id.startsWith('pv-')) { S.products[PRODUCTS[+id.slice(3)]].validation = t.checked; renderSettings(); }
    else if (id.startsWith('pm-')) S.products[PRODUCTS[+id.slice(3)]].mode = t.value;
    else if (id.startsWith('cf-')) S.checks[id.slice(3)].fail = t.value;
    else if (id.startsWith('cu-')) S.checks[id.slice(3)].unsure = t.value;
    else if (id === 'o-spot') S.opts.spot = +t.value;
    else if (id === 'o-crop') S.opts.autocrop = t.checked;
    else if (id === 'o-reuse') S.opts.reuse = t.checked;
    else if (id.startsWith('rl-') || id.startsWith('rg-')) { const r = reasonById(id.slice(3)); if (r) r[id.startsWith('rl-') ? 'label' : 'guest'] = t.value; }
    else saved = false;
    if (saved) toast('Saved', 'ok');
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && S.keysOpen) { S.keysOpen = false; renderQueue(); return; }
    if (S.view !== 'queue' || e.target.closest('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === '?') { S.keysOpen = !S.keysOpen; renderQueue(); return; }
    if (S.qtab !== 'review') return;
    const q = S.queue[S.sel];
    if (k === 'z') { undo(); e.preventDefault(); return; }
    if (!q) return;
    if (k === 'a') decide('approve');
    else if (k === 'd') decide('deny');
    else if (k === 'j' || k === 'arrowdown') { S.sel = Math.min(S.queue.length - 1, S.sel + 1); renderQueue(); }
    else if (k === 'k' || k === 'arrowup') { S.sel = Math.max(0, S.sel - 1); renderQueue(); }
    else if (/^[1-9]$/.test(k) && REASONS[+k - 1]) { const r = REASONS[+k - 1].id, s = S.reasons[q.id]; s.has(r) ? s.delete(r) : s.add(r); renderQueue(); }
    else return;
    e.preventDefault();
  });

  let start = 'queue';
  try { const h = location.hash.slice(1); if (VIEWS.includes(h)) start = h; } catch (_) {}
  show(start);
})();
</script>
